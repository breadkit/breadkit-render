name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, ruby: "3.3" }
          - { os: ubuntu-latest, ruby: "3.4" }
          - { os: ubuntu-latest, ruby: "4.0" }
          - { os: macos-latest, ruby: "4.0" }
    defaults:
      run:
        working-directory: breadkit-render
    steps:
      - name: Checkout breadkit examples
        uses: actions/checkout@v6
        with:
          repository: breadkit/breadkit
          ref: 7bccfcdefa8635f69ba32193dcab425582ea1cf8
          path: breadkit
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          path: breadkit-render
          persist-credentials: false
      - name: Install rasterizer (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin libvips-dev fonts-noto-cjk
        working-directory: .
      - name: Install rasterizer (macOS)
        if: runner.os == 'macOS'
        run: brew install librsvg vips
        working-directory: .
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: breadkit-render
      - run: bundle exec rake
      - name: Render core examples
        run: |
          mkdir -p /tmp/breadkit-render-examples
          for file in ../breadkit/examples/*.bk.rb; do
            name="${file##*/}"
            bundle exec bkrender "$file" -o "/tmp/breadkit-render-examples/${name%.bk.rb}.png" --scale 2
          done

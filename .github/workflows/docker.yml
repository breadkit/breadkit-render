name: Docker image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - Dockerfile.dockerignore
      - lib/**
      - exe/**
      - breadkit-render.gemspec
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: breadkit/breadkit
          ref: main
          path: breadkit
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: breadkit-render
          persist-credentials: false
      - name: Record core revision
        id: core
        run: echo "sha=$(git -C breadkit rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: breadkit-render/Dockerfile
          push: true
          tags: |
            ghcr.io/breadkit/breadkit-render:main
            ghcr.io/breadkit/breadkit-render:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/breadkit/breadkit-render
            org.opencontainers.image.revision=${{ github.sha }}
            io.breadkit.core-revision=${{ steps.core.outputs.sha }}
